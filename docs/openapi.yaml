  ###########################################################
  # BADGES
  ###########################################################

  /users/{id}/badges:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the user
        schema:
          type: integer
  
    get:
      tags: [Badges]
      summary: List badges earned by a user
      description: Retrieve all badges that the specified user has earned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of badges earned by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Badge'
                    - type: object
                      properties:
                        earned_at:
                          type: string
                          format: date-time
                          example: "2025-02-15T10:30:00Z"
  
    post:
      tags: [Badges]
      summary: Grant a badge to a user (admin only)
      description: Assign an existing badge to a user. Requires admin privileges.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [badge_id]
              properties:
                badge_id:
                  type: integer
                  example: 3
      responses:
        '201':
          description: Badge successfully granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Badge granted to user"
                  user_id:
                    type: integer
                    example: 42
                  badge_id:
                    type: integer
                    example: 3
                  earned_at:
                    type: string
                    format: date-time
                    example: "2025-02-15T10:30:00Z"
        '403':
          description: Forbidden — admin privileges required
  
    delete:
      tags: [Badges]
      summary: Revoke a badge from a user (admin only)
      description: Remove a previously granted badge from the specified user. Requires admin privileges.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Badge successfully revoked
        '403':
          description: Forbidden — admin privileges required
        '404':
          description: Badge not found for this user
          
