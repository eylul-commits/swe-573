openapi: 3.0.3
info:
  title: The Hive Community Service API
  version: 1.0.0
  description: |
    REST API documentation for *The Hive* community service platform.

servers:
  - url: https://api.thehive.community/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        bio: { type: string }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        balance_hours: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        bio: { type: string }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
    
    Offer:
      type: object
      properties:
        id: { type: integer }
        provider_id: { type: integer }
        title: { type: string }
        description: { type: string }
        duration_hours: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, ARCHIVED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tag_ids:
          type: array
          description: "List of associated semantic tag IDs."
          items:
            type: integer
    
    OfferCreate:
      type: object
      required: [title, description, duration_hours, start_date, end_date, province, district]
      properties:
        title: { type: string }
        description: { type: string }
        duration_hours: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
        tag_ids:
          type: array
          description: "List of associated semantic tag IDs."
          items:
            type: integer
    
    OfferUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        duration_hours: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, ARCHIVED] }
        tag_ids:
          type: array
          items:
            type: integer
    
    Request:
      type: object
      properties:
        id: { type: integer }
        seeker_id: { type: integer }
        title: { type: string }
        description: { type: string }
        duration_hours: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, ARCHIVED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tag_ids:
          type: array
          description: "List of associated semantic tag IDs."
          items:
            type: integer
    
    RequestCreate:
      type: object
      required: [title, description, duration_hours, start_date, end_date, province, district]
      properties:
        title: { type: string }
        description: { type: string }
        duration_hours: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
        tag_ids:
          type: array
          description: "List of associated semantic tag IDs."
          items:
            type: integer
    
    RequestUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        duration_hours: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        province: { type: string }
        district: { type: string }
        geohash: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, ARCHIVED] }
        tag_ids:
          type: array
          items:
            type: integer
    
    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        wikidata_id: { type: string }
    
    Badge:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        icon_url: { type: string }
    
    BadgeCreate:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
        icon_url: { type: string }
    
    Handshake:
      type: object
      properties:
        id: { type: integer }
        offer_id: { type: integer }
        seeker_id: { type: integer }
        provider_id: { type: integer }
        status: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED] }
        agreed_hours: { type: integer }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    
    HandshakeCreate:
      type: object
      required: [offer_id, agreed_hours]
      properties:
        offer_id: { type: integer }
        agreed_hours: { type: integer }
    
    Transaction:
      type: object
      properties:
        id: { type: integer }
        sender_id: { type: integer }
        receiver_id: { type: integer }
        handshake_id: { type: integer }
        amount: { type: integer }
        description: { type: string }
        created_at: { type: string, format: date-time }
    Rating:
      type: object
      properties:
        id: { type: integer }
        handshake_id: { type: integer }
        rater_id: { type: integer }
        ratee_id: { type: integer }
        punctuality: { type: integer }
        friendliness: { type: integer }
        communicative: { type: integer }
        preparedness: { type: integer }
        comment: { type: string }
        created_at: { type: string, format: date-time }
    
    RatingCreate:
      type: object
      required: [handshake_id, ratee_id, punctuality, friendliness, communicative, preparedness]
      properties:
        handshake_id: { type: integer }
        ratee_id: { type: integer }
        punctuality: { type: integer, minimum: 1, maximum: 5 }
        friendliness: { type: integer, minimum: 1, maximum: 5 }
        communicative: { type: integer, minimum: 1, maximum: 5 }
        preparedness: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
    
    Message:
      type: object
      properties:
        id: { type: integer }
        sender_id: { type: integer }
        receiver_id: { type: integer }
        offer_id: { type: integer, nullable: true }
        request_id: { type: integer, nullable: true }
        handshake_id: { type: integer, nullable: true }
        content: { type: string }
        created_at: { type: string, format: date-time }
    
    MessageCreate:
      type: object
      required: [receiver_id, content]
      properties:
        receiver_id: { type: integer }
        offer_id: 
          type: integer
          nullable: true
          description: "Optional: ID of the offer this message is about"
        request_id:
          type: integer
          nullable: true
          description: "Optional: ID of the request this message is about"
        handshake_id:
          type: integer
          nullable: true
          description: "Optional: ID of the handshake this message is about"
        content: { type: string }
    
    # Error schemas
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
    
####### I am adding these just to show my internal architecture:
    OfferTag:
      type: object
      description: Join table linking Offers and Semantic Tags
      properties:
        offer_id: { type: integer }
        tag_id: { type: integer }
  
    RequestTag:
      type: object
      description: Join table linking Requests and Semantic Tags
      properties:
        request_id: { type: integer }
        tag_id: { type: integer }
  
    UserBadge:
      type: object
      description: Join table linking Users and Badges
      properties:
        user_id: { type: integer }
        badge_id: { type: integer }
########################
    Question:
      type: object
      properties:
        id: { type: integer }
        offer_id: { type: integer, nullable: true, description: "ID of the offer (if question is about an offer)" }
        request_id: { type: integer, nullable: true, description: "ID of the request (if question is about a request)" }
        asker_id: { type: integer }
        content: { type: string }
        created_at: { type: string, format: date-time }
    
    Answer:
      type: object
      properties:
        id: { type: integer }
        question_id: { type: integer }
        responder_id: { type: integer }
        content: { type: string }
        created_at: { type: string, format: date-time }
    
    Report:
      type: object
      properties:
        id: { type: integer }
        reporter_id: { type: integer }
        reported_user_id: { type: integer }
        message: { type: string }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        
    ForumTopic:
      type: object
      properties:
        id:
          type: integer
          example: 10
        author_id:
          type: integer
          description: "User who created the topic"
          example: 5
        title:
          type: string
          description: "Title of the forum topic"
          example: "Ideas for new community events"
        created_at:
          type: string
          format: date-time
          example: "2025-10-18T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-19T08:30:00Z"

    ForumPost:
      type: object
      properties:
        id:
          type: integer
          example: 88
        topic_id:
          type: integer
          description: "ID of the forum topic this post belongs to"
          example: 10
        author_id:
          type: integer
          description: "User who created the post"
          example: 7
        content:
          type: string
          description: "Content of the post"
          example: "I think we should organize a monthly cleanup drive!"
        created_at:
          type: string
          format: date-time
          example: "2025-10-19T15:45:00Z"

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                province: { type: string }
                district: { type: string }
                geohash: { type: string }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      tags: [Users]
      summary: List users (admin)
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Delete user (admin)
      responses:
        '204':
          description: Deleted

  /offers:
    get:
      tags: [Offers]
      summary: List offers
      parameters:
        - name: province
          in: query
          schema:
            type: string
          description: Filter by province
        - name: district
          in: query
          schema:
            type: string
          description: Filter by district
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, ARCHIVED]
          description: Filter by status
        - name: tag_id
          in: query
          schema:
            type: integer
          description: Filter by tag ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
    post:
      tags: [Offers]
      summary: Create an offer
      description: Create a new offer. The provider_id is automatically set from the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreate'
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /offers/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      tags: [Offers]
      summary: Get offer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Offer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '404':
          description: Offer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Offers]
      summary: Update an offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferUpdate'
      responses:
        '200':
          description: Offer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
    delete:
      tags: [Offers]
      summary: Delete or archive an offer
      responses:
        '204':
          description: Offer deleted

  /requests:
    get:
      tags: [Requests]
      summary: List requests
      parameters:
        - name: province
          in: query
          schema:
            type: string
          description: Filter by province
        - name: district
          in: query
          schema:
            type: string
          description: Filter by district
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, ARCHIVED]
          description: Filter by status
        - name: tag_id
          in: query
          schema:
            type: integer
          description: Filter by tag ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
    post:
      tags: [Requests]
      summary: Create a request
      description: Create a new request. The seeker_id is automatically set from the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          
  /requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Requests]
      summary: Get request by ID
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Requests]
      summary: Update a request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdate'
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
    delete:
      tags: [Requests]
      summary: Delete or archive a request
      responses:
        '204':
          description: Request deleted
        
  /handshakes:
    get:
      tags: [Handshakes]
      summary: List handshakes
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
          description: Filter by status
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user (either seeker or provider)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: Handshake list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Handshake'
    post:
      tags: [Handshakes]
      summary: Create handshake
      description: Create a new handshake for an offer. The seeker and provider IDs are derived from the authenticated user and the offer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandshakeCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handshake'

  /handshakes/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      tags: [Handshakes]
      summary: Get handshake by ID
      responses:
        '200':
          description: Handshake detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handshake'
    put:
      tags: [Handshakes]
      summary: Update handshake status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handshake'

  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user (either sender or receiver)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
  
  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Transactions]
      summary: Get transaction by ID
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  /ratings:
    post:
      tags: [Ratings]
      summary: Submit rating
      description: Submit a rating for a user after a handshake. The rater_id is derived from the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCreate'
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'

  /ratings/{user_id}:
    get:
      tags: [Ratings]
      summary: Get ratings for a user
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rating'

  /messages:
    get:
      tags: [Messages]
      summary: List messages
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      tags: [Messages]
      summary: Send message
      description: |
        Send a message to another user. The sender_id is derived from the authenticated user.
        You can optionally associate the message with an offer, request, or handshake by providing the corresponding ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          
  
  /tags:
    get:
      tags: [Semantic Tags]
      summary: List all semantic tags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      tags: [Semantic Tags]
      summary: Create a new tag
      description: Create a semantic tag that links to a Wikidata concept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
